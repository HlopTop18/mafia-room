<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video Room</title>

    <!-- LiveKit -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
        }

        body {
            overflow: hidden;
        }

        /* =========================
           LOGIN
        ========================= */

        #loginScreen {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at top, #273449, #111827 60%);
        }

        .login-box {
            width: min(420px, calc(100% - 30px));
            padding: 30px;
            border-radius: 20px;
            background: #1f2937;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .login-box h1 {
            margin: 0 0 8px;
            text-align: center;
        }

        .login-box p {
            margin: 0 0 25px;
            text-align: center;
            color: #9ca3af;
        }

        .field {
            margin-bottom: 15px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            color: #d1d5db;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #374151;
            border-radius: 10px;
            outline: none;
            background: #111827;
            color: white;
            font-size: 16px;
        }

        input:focus {
            border-color: #60a5fa;
        }

        #joinButton {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #joinButton:hover {
            background: #1d4ed8;
        }

        #errorMessage {
            margin-top: 15px;
            color: #f87171;
            text-align: center;
            min-height: 20px;
        }

        /* =========================
           APP
        ========================= */

        #app {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            height: 65px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            background: #1f2937;
            border-bottom: 1px solid #374151;
        }

        .room-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .room-title strong {
            font-size: 17px;
        }

        .room-status {
            color: #9ca3af;
            font-size: 13px;
        }

        .participants-count {
            color: #9ca3af;
            font-size: 14px;
        }

        /* =========================
           VIDEO AREA
        ========================= */

        #videoGrid {
            flex: 1;
            min-height: 0;
            padding: 12px;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-template-rows: repeat(3, minmax(0, 1fr));
            gap: 12px;
            overflow-y: auto;
        }

        .video-card {
            position: relative;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            border-radius: 14px;
            background: #0b1220;
            border: 1px solid #374151;
        }

        .video-card video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            background: #0b1220;
        }

        .video-card.no-video video {
            display: none;
        }

        .avatar {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #172033;
            font-size: clamp(35px, 5vw, 70px);
            font-weight: bold;
            color: #9ca3af;
        }

        .video-card:not(.no-video) .avatar {
            display: none;
        }

        .participant-name {
            position: absolute;
            left: 10px;
            bottom: 10px;
            max-width: calc(100% - 20px);
            padding: 6px 9px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.65);
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mic-status {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.65);
            font-size: 15px;
        }

        .local-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 5px 8px;
            border-radius: 7px;
            background: rgba(37, 99, 235, 0.9);
            font-size: 11px;
        }

        /* =========================
           CONTROLS
        ========================= */

        .controls {
            height: 78px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            background: #1f2937;
            border-top: 1px solid #374151;
        }

        .control-button {
            width: 52px;
            height: 52px;
            border: 0;
            border-radius: 50%;
            background: #374151;
            color: white;
            font-size: 21px;
            cursor: pointer;
            transition: 0.15s;
        }

        .control-button:hover {
            background: #4b5563;
        }

        .control-button.active {
            background: #2563eb;
        }

        .control-button.off {
            background: #dc2626;
        }

        #leaveButton {
            width: auto;
            padding: 0 20px;
            border-radius: 26px;
            background: #dc2626;
            font-size: 15px;
        }

        #leaveButton:hover {
            background: #b91c1c;
        }

        /* =========================
           VOLUME PANEL
        ========================= */

        #volumePanel {
            position: fixed;
            right: 15px;
            bottom: 95px;
            width: 260px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
            padding: 15px;
            border-radius: 14px;
            background: #1f2937;
            border: 1px solid #374151;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            z-index: 100;
        }

        #volumePanel h3 {
            margin: 0 0 14px;
            font-size: 15px;
        }

        .volume-row {
            margin-bottom: 14px;
        }

        .volume-name {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 13px;
            color: #d1d5db;
        }

        .volume-row input[type="range"] {
            width: 100%;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 900px) {
            #videoGrid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                grid-template-rows: repeat(6, minmax(0, 1fr));
            }
        }

        @media (max-width: 600px) {
            .header {
                height: 55px;
            }

            .room-status {
                display: none;
            }

            #videoGrid {
                padding: 7px;
                gap: 7px;
            }

            .controls {
                height: 70px;
            }

            .control-button {
                width: 46px;
                height: 46px;
                font-size: 18px;
            }

            #leaveButton {
                padding: 0 14px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<!-- =========================
     LOGIN SCREEN
========================= -->

<div id="loginScreen">

    <div class="login-box">

        <h1>🎥 Video Room</h1>

        <p>Приєднайся до відеокімнати</p>

        <div class="field">
            <label for="roomInput">Назва кімнати</label>
            <input
                id="roomInput"
                type="text"
                placeholder="Наприклад: room123"
                autocomplete="off"
            >
        </div>

        <div class="field">
            <label for="nameInput">Твоє ім'я</label>
            <input
                id="nameInput"
                type="text"
                placeholder="Введи ім'я"
                autocomplete="off"
            >
        </div>

        <button id="joinButton">
            Увійти в кімнату
        </button>

        <div id="errorMessage"></div>

    </div>

</div>


<!-- =========================
     MAIN APP
========================= -->

<div id="app">

    <header class="header">

        <div class="room-title">

            <strong id="roomNameDisplay">
                Кімната
            </strong>

            <span class="room-status" id="connectionStatus">
                Підключення...
            </span>

        </div>

        <div class="participants-count" id="participantsCount">
            0 / 12
        </div>

    </header>


    <main id="videoGrid"></main>


    <div class="controls">

        <button
            id="cameraButton"
            class="control-button active"
            title="Камера"
        >
            📹
        </button>

        <button
            id="micButton"
            class="control-button active"
            title="Мікрофон"
        >
            🎤
        </button>

        <button
            id="volumeButton"
            class="control-button"
            title="Гучність"
        >
            🔊
        </button>

        <button
            id="leaveButton"
            class="control-button"
            title="Вийти"
        >
            Вийти
        </button>

    </div>

</div>


<!-- =========================
     VOLUME PANEL
========================= -->

<div id="volumePanel">

    <h3>🔊 Гучність учасників</h3>

    <div id="volumeList"></div>

</div>


<script>

    /* =====================================================
       GLOBAL VARIABLES
    ===================================================== */

    let room = null;

    let roomName = "";
    let participantName = "";

    let ws = null;

    const videoElements = new Map();
    const audioElements = new Map();
    const participantCards = new Map();

    let leaving = false;


    /* =====================================================
       DOM
    ===================================================== */

    const loginScreen = document.getElementById("loginScreen");
    const app = document.getElementById("app");

    const roomInput = document.getElementById("roomInput");
    const nameInput = document.getElementById("nameInput");

    const joinButton = document.getElementById("joinButton");

    const errorMessage = document.getElementById("errorMessage");

    const videoGrid = document.getElementById("videoGrid");

    const roomNameDisplay =
        document.getElementById("roomNameDisplay");

    const connectionStatus =
        document.getElementById("connectionStatus");

    const participantsCount =
        document.getElementById("participantsCount");

    const cameraButton =
        document.getElementById("cameraButton");

    const micButton =
        document.getElementById("micButton");

    const volumeButton =
        document.getElementById("volumeButton");

    const leaveButton =
        document.getElementById("leaveButton");

    const volumePanel =
        document.getElementById("volumePanel");

    const volumeList =
        document.getElementById("volumeList");


    /* =====================================================
       HELPERS
    ===================================================== */

    function escapeHtml(value) {

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }


    function getInitial(name) {

        if (!name) {
            return "?";
        }

        return name.trim().charAt(0).toUpperCase();

    }


    function showError(message) {

        errorMessage.textContent = message;

    }


    function clearError() {

        errorMessage.textContent = "";

    }


    /* =====================================================
       CREATE PARTICIPANT CARD
    ===================================================== */

    function createParticipantCard(identity, name, isLocal = false) {

        if (participantCards.has(identity)) {

            return participantCards.get(identity);

        }

        const card = document.createElement("div");

        card.className = "video-card no-video";

        card.dataset.identity = identity;

        card.innerHTML = `

            <div class="avatar">
                ${escapeHtml(getInitial(name))}
            </div>

            <video
                autoplay
                playsinline
                muted="${isLocal ? "true" : "false"}"
            ></video>

            <div class="participant-name">
                ${escapeHtml(name)}
            </div>

            <div class="mic-status">
                🎤
            </div>

            ${
                isLocal
                    ? `<div class="local-badge">Ви</div>`
                    : ""
            }

        `;

        videoGrid.appendChild(card);

        participantCards.set(identity, card);

        updateParticipantCount();

        return card;

    }


    /* =====================================================
       REMOVE PARTICIPANT CARD
    ===================================================== */

    function removeParticipantCard(identity) {

        const card = participantCards.get(identity);

        if (!card) {
            return;
        }

        const video = card.querySelector("video");

        if (video) {

            try {
                video.pause();
            } catch {}

            video.srcObject = null;

        }

        card.remove();

        participantCards.delete(identity);

        videoElements.delete(identity);

        audioElements.delete(identity);

        updateParticipantCount();

        updateVolumeList();

    }


    /* =====================================================
       VIDEO ATTACH
    ===================================================== */

    function attachVideoTrack(track, participant) {

        const identity = participant.identity;

        const name =
            participant.name ||
            participant.identity;

        const card =
            createParticipantCard(
                identity,
                name,
                participant.isLocal
            );

        const video =
            card.querySelector("video");

        if (!video) {
            return;
        }

        try {

            track.detach();

        } catch {}

        track.attach(video);

        video.autoplay = true;
        video.playsInline = true;

        if (participant.isLocal) {
            video.muted = true;
        }

        card.classList.remove("no-video");

        videoElements.set(identity, video);

    }


    /* =====================================================
       VIDEO DETACH
    ===================================================== */

    function detachVideoTrack(track, participant) {

        const identity = participant.identity;

        try {

            track.detach();

        } catch {}

        const video =
            videoElements.get(identity);

        if (video) {

            video.srcObject = null;

        }

        videoElements.delete(identity);

        const card =
            participantCards.get(identity);

        if (card) {

            card.classList.add("no-video");

        }

    }


    /* =====================================================
       AUDIO ATTACH
    ===================================================== */

    function attachAudioTrack(track, participant) {

        const identity = participant.identity;

        let audio =
            audioElements.get(identity);

        if (!audio) {

            audio =
                document.createElement("audio");

            audio.autoplay = true;

            audio.playsInline = true;

            audio.dataset.identity = identity;

            document.body.appendChild(audio);

            audioElements.set(identity, audio);

        }

        try {

            track.detach();

        } catch {}

        track.attach(audio);

        audio.autoplay = true;

        if (!participant.isLocal) {

            audio.muted = false;

            audio.volume = 1;

            audio.play().catch(() => {});

        }

        updateVolumeList();

    }


    /* =====================================================
       AUDIO DETACH
    ===================================================== */

    function detachAudioTrack(track, participant) {

        try {

            track.detach();

        } catch {}

        const audio =
            audioElements.get(
                participant.identity
            );

        if (audio) {

            audio.pause();

            audio.srcObject = null;

            audio.remove();

        }

        audioElements.delete(
            participant.identity
        );

        updateVolumeList();

    }


    /* =====================================================
       UPDATE MIC ICON
    ===================================================== */

    function updateParticipantMic(participant) {

        const card =
            participantCards.get(
                participant.identity
            );

        if (!card) {
            return;
        }

        const micStatus =
            card.querySelector(".mic-status");

        if (!micStatus) {
            return;
        }

        if (participant.isMicrophoneEnabled) {

            micStatus.textContent = "🎤";

            micStatus.style.opacity = "1";

        } else {

            micStatus.textContent = "🔇";

            micStatus.style.opacity = "0.9";

        }

    }


    /* =====================================================
       UPDATE LOCAL BUTTONS
    ===================================================== */

    function updateControls() {

        if (!room) {
            return;
        }

        const local =
            room.localParticipant;

        const cameraOn =
            local.isCameraEnabled;

        const micOn =
            local.isMicrophoneEnabled;

        cameraButton.classList.toggle(
            "active",
            cameraOn
        );

        cameraButton.classList.toggle(
            "off",
            !cameraOn
        );

        cameraButton.textContent =
            cameraOn ? "📹" : "📷";

        micButton.classList.toggle(
            "active",
            micOn
        );

        micButton.classList.toggle(
            "off",
            !micOn
        );

        micButton.textContent =
            micOn ? "🎤" : "🔇";

        updateParticipantMic(local);

    }


    /* =====================================================
       UPDATE PARTICIPANT COUNT
    ===================================================== */

    function updateParticipantCount() {

        const count =
            participantCards.size;

        participantsCount.textContent =
            `${count} / 12`;

    }


    /* =====================================================
       VOLUME LIST
    ===================================================== */

    function updateVolumeList() {

        volumeList.innerHTML = "";

        audioElements.forEach(
            (audio, identity) => {

                let name = identity;

                const participant =
                    room?.getParticipantByIdentity(
                        identity
                    );

                if (participant) {

                    name =
                        participant.name ||
                        participant.identity;

                }

                const row =
                    document.createElement("div");

                row.className =
                    "volume-row";

                const currentVolume =
                    Math.round(audio.volume * 100);

                row.innerHTML = `

                    <div class="volume-name">

                        <span>
                            ${escapeHtml(name)}
                        </span>

                        <span>
                            ${currentVolume}%
                        </span>

                    </div>

                    <input
                        type="range"
                        min="0"
                        max="100"
                        value="${currentVolume}"
                    >

                `;

                const slider =
                    row.querySelector(
                        'input[type="range"]'
                    );

                slider.addEventListener(
                    "input",
                    () => {

                        const value =
                            Number(slider.value);

                        audio.volume =
                            value / 100;

                        row.querySelector(
                            ".volume-name span:last-child"
                        ).textContent =
                            `${value}%`;

                    }
                );

                volumeList.appendChild(row);

            }
        );

    }


    /* =====================================================
       ADD EXISTING PARTICIPANTS
    ===================================================== */

    function renderExistingParticipants() {

        if (!room) {
            return;
        }

        const local =
            room.localParticipant;

        createParticipantCard(
            local.identity,
            local.name || local.identity,
            true
        );

        updateParticipantMic(local);

        room.remoteParticipants.forEach(
            participant => {

                createParticipantCard(
                    participant.identity,
                    participant.name ||
                    participant.identity,
                    false
                );

                updateParticipantMic(
                    participant
                );

                participant.trackPublications
                    .forEach(publication => {

                        if (
                            publication.isSubscribed &&
                            publication.track
                        ) {

                            if (
                                publication.kind ===
                                LivekitClient.Track.Kind.Video
                            ) {

                                attachVideoTrack(
                                    publication.track,
                                    participant
                                );

                            }

                            if (
                                publication.kind ===
                                LivekitClient.Track.Kind.Audio
                            ) {

                                attachAudioTrack(
                                    publication.track,
                                    participant
                                );

                            }

                        }

                    });

            }
        );

        updateParticipantCount();

    }


    /* =====================================================
       ROOM EVENTS
    ===================================================== */

    function setupRoomEvents() {

        room.on(
            LivekitClient.RoomEvent.ParticipantConnected,
            participant => {

                createParticipantCard(
                    participant.identity,
                    participant.name ||
                    participant.identity,
                    false
                );

                updateParticipantMic(
                    participant
                );

                updateParticipantCount();

                updateVolumeList();

            }
        );


        room.on(
            LivekitClient.RoomEvent.ParticipantDisconnected,
            participant => {

                removeParticipantCard(
                    participant.identity
                );

            }
        );


        room.on(
            LivekitClient.RoomEvent.TrackSubscribed,
            (track, publication, participant) => {

                if (
                    track.kind ===
                    LivekitClient.Track.Kind.Video
                ) {

                    attachVideoTrack(
                        track,
                        participant
                    );

                }

                if (
                    track.kind ===
                    LivekitClient.Track.Kind.Audio
                ) {

                    attachAudioTrack(
                        track,
                        participant
                    );

                }

                updateParticipantMic(
                    participant
                );

            }
        );


        room.on(
            LivekitClient.RoomEvent.TrackUnsubscribed,
            (track, publication, participant) => {

                if (
                    track.kind ===
                    LivekitClient.Track.Kind.Video
                ) {

                    detachVideoTrack(
                        track,
                        participant
                    );

                }

                if (
                    track.kind ===
                    LivekitClient.Track.Kind.Audio
                ) {

                    detachAudioTrack(
                        track,
                        participant
                    );

                }

            }
        );


        room.on(
            LivekitClient.RoomEvent.LocalTrackPublished,
            publication => {

                if (
                    publication.track
                ) {

                    if (
                        publication.kind ===
                        LivekitClient.Track.Kind.Video
                    ) {

                        attachVideoTrack(
                            publication.track,
                            room.localParticipant
                        );

                    }

                }

                updateControls();

            }
        );


        room.on(
            LivekitClient.RoomEvent.LocalTrackUnpublished,
            publication => {

                if (
                    publication.track
                ) {

                    try {

                        publication.track.detach();

                    } catch {}

                }

                updateControls();

            }
        );


        room.on(
            LivekitClient.RoomEvent.TrackMuted,
            (publication, participant) => {

                updateParticipantMic(
                    participant
                );

            }
        );


        room.on(
            LivekitClient.RoomEvent.TrackUnmuted,
            (publication, participant) => {

                updateParticipantMic(
                    participant
                );

            }
        );


        room.on(
            LivekitClient.RoomEvent.ActiveSpeakersChanged,
            speakers => {

                participantCards.forEach(
                    (card, identity) => {

                        const active =
                            speakers.some(
                                participant =>
                                    participant.identity ===
                                    identity
                            );

                        if (active) {

                            card.style.border =
                                "2px solid #22c55e";

                        } else {

                            card.style.border =
                                "1px solid #374151";

                        }

                    }
                );

            }
        );


        room.on(
            LivekitClient.RoomEvent.Disconnected,
            () => {

                if (!leaving) {

                    connectionStatus.textContent =
                        "Відключено";

                }

            }
        );


        room.on(
            LivekitClient.RoomEvent.MediaDevicesError,
            error => {

                console.error(
                    "Media device error:",
                    error
                );

                showError(
                    "Не вдалося отримати доступ до камери або мікрофона."
                );

            }
        );

    }


    /* =====================================================
       CONNECT
    ===================================================== */

    async function connectToRoom() {

        roomName =
            roomInput.value.trim();

        participantName =
            nameInput.value.trim();

        clearError();

        if (!roomName) {

            showError(
                "Введи назву кімнати."
            );

            return;

        }

        if (!participantName) {

            showError(
                "Введи своє ім'я."
            );

            return;

        }

        joinButton.disabled = true;

        joinButton.textContent =
            "Підключення...";

        try {

            const response =
                await fetch(
                    "/api/livekit-token",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            roomName,
                            participantName
                        })
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Не вдалося отримати токен."
                );

            }


            /* =========================
               CREATE ROOM
            ========================= */

            room =
                new LivekitClient.Room({

                    adaptiveStream: true,

                    dynacast: true,

                    disconnectOnPageLeave: false,

                    videoCaptureDefaults: {

                        resolution:
                            LivekitClient.VideoPresets
                                .h720
                                .resolution

                    }

                });


            setupRoomEvents();


            /* =========================
               CONNECT
            ========================= */

            connectionStatus.textContent =
                "Підключення...";

            await room.connect(
                data.url,
                data.token,
                {
                    autoSubscribe: true
                }
            );


            /* =========================
               UI
            ========================= */

            loginScreen.style.display =
                "none";

            app.style.display =
                "flex";

            roomNameDisplay.textContent =
                `Кімната: ${roomName}`;

            connectionStatus.textContent =
                "Підключено";

            createParticipantCard(
                room.localParticipant.identity,
                room.localParticipant.name ||
                participantName,
                true
            );


            /* =========================
               CAMERA + MICROPHONE
            ========================= */

            try {

                await room.localParticipant
                    .enableCameraAndMicrophone();

            } catch (mediaError) {

                console.error(
                    "Camera/microphone error:",
                    mediaError
                );

                /*
                    Якщо браузер не дав доступ,
                    кімната все одно відкриється.
                */

                showError(
                    "Кімната відкрита, але немає доступу до камери/мікрофона."
                );

            }


            renderExistingParticipants();

            updateControls();

            updateVolumeList();

            updateParticipantCount();


            /* =========================
               WEBSOCKET
            ========================= */

            connectWebSocket();

        } catch (error) {

            console.error(
                "Connection error:",
                error
            );

            showError(
                error.message ||
                "Не вдалося підключитися."
            );

            joinButton.disabled =
                false;

            joinButton.textContent =
                "Увійти в кімнату";

        }

    }


    /* =====================================================
       WEBSOCKET
    ===================================================== */

    function connectWebSocket() {

        try {

            const protocol =
                location.protocol === "https:"
                    ? "wss:"
                    : "ws:";

            ws =
                new WebSocket(
                    `${protocol}//${location.host}/ws`
                );

            ws.addEventListener(
                "open",
                () => {

                    ws.send(
                        JSON.stringify({
                            type: "join",
                            roomName,
                            playerName:
                                participantName
                        })
                    );

                }
            );

            ws.addEventListener(
                "message",
                event => {

                    try {

                        const message =
                            JSON.parse(
                                event.data
                            );

                        console.log(
                            "WebSocket:",
                            message
                        );

                    } catch {}

                }
            );

        } catch (error) {

            console.error(
                "WebSocket error:",
                error
            );

        }

    }


    /* =====================================================
       CAMERA BUTTON
    ===================================================== */

    cameraButton.addEventListener(
        "click",
        async () => {

            if (!room) {
                return;
            }

            try {

                await room.localParticipant
                    .setCameraEnabled(
                        !room.localParticipant
                            .isCameraEnabled
                    );

                updateControls();

            } catch (error) {

                console.error(
                    "Camera error:",
                    error
                );

            }

        }
    );


    /* =====================================================
       MICROPHONE BUTTON
    ===================================================== */

    micButton.addEventListener(
        "click",
        async () => {

            if (!room) {
                return;
            }

            try {

                await room.localParticipant
                    .setMicrophoneEnabled(
                        !room.localParticipant
                            .isMicrophoneEnabled
                    );

                updateControls();

            } catch (error) {

                console.error(
                    "Microphone error:",
                    error
                );

            }

        }
    );


    /* =====================================================
       VOLUME BUTTON
    ===================================================== */

    volumeButton.addEventListener(
        "click",
        () => {

            const isVisible =
                volumePanel.style.display ===
                "block";

            volumePanel.style.display =
                isVisible
                    ? "none"
                    : "block";

            if (!isVisible) {

                updateVolumeList();

            }

        }
    );


    /* =====================================================
       LEAVE ROOM
    ===================================================== */

    leaveButton.addEventListener(
        "click",
        leaveRoom
    );


    async function leaveRoom() {

        if (leaving) {
            return;
        }

        leaving = true;

        leaveButton.disabled =
            true;

        try {

            /* =========================
               CLOSE WEBSOCKET
            ========================= */

            if (ws) {

                try {
                    ws.close();
                } catch {}

                ws = null;

            }


            /* =========================
               DISCONNECT LIVEKIT
               stopTracks = true
            ========================= */

            if (room) {

                try {

                    await room.disconnect(
                        true
                    );

                } catch (error) {

                    console.error(
                        "LiveKit disconnect error:",
                        error
                    );

                }

            }


            /* =========================
               REMOVE ALL MEDIA
            ========================= */

            document
                .querySelectorAll(
                    "video, audio"
                )
                .forEach(element => {

                    try {
                        element.pause();
                    } catch {}

                    try {
                        element.srcObject = null;
                    } catch {}

                    element.remove();

                });


            /* =========================
               RESET
            ========================= */

            room = null;

            videoElements.clear();

            audioElements.clear();

            participantCards.clear();

            videoGrid.innerHTML = "";

            volumeList.innerHTML = "";

            volumePanel.style.display =
                "none";

            connectionStatus.textContent =
                "Підключення...";

            participantsCount.textContent =
                "0 / 12";

            app.style.display =
                "none";

            loginScreen.style.display =
                "flex";

            joinButton.disabled =
                false;

            joinButton.textContent =
                "Увійти в кімнату";

            clearError();

        } finally {

            leaving = false;

            leaveButton.disabled =
                false;

        }

    }


    /* =====================================================
       ENTER KEY
    ===================================================== */

    roomInput.addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {

                nameInput.focus();

            }

        }
    );


    nameInput.addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {

                connectToRoom();

            }

        }
    );


    joinButton.addEventListener(
        "click",
        connectToRoom
    );


    /* =====================================================
       PAGE CLOSE
    ===================================================== */

    window.addEventListener(
        "beforeunload",
        () => {

            if (ws) {

                try {
                    ws.close();
                } catch {}

            }

            if (room) {

                try {

                    room.disconnect(
                        true
                    );

                } catch {}

            }

        }
    );

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mafia Room</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#0b0c10;
color:#eee;
font-family:Arial, sans-serif;
}

header{
height:64px;
background:#12141a;
border-bottom:1px solid #292d36;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 20px;
}

.logo{
font-size:20px;
font-weight:bold;
}

.logo span{
color:#e53945;
}

.room{
font-size:14px;
color:#aaa;
}

main{
max-width:1280px;
margin:auto;
padding:18px;
}

.controls{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:15px;
}

input{
background:#171a21;
border:1px solid #343946;
border-radius:9px;
padding:11px;
color:white;
}

button{
background:#252a35;
color:white;
border:0;
border-radius:9px;
padding:11px 15px;
cursor:pointer;
}

button:hover{
background:#343b49;
}

.red{
background:#a82935;
}

.green{
background:#176344;
}

/* 4 × 3 */

.board{
display:grid;

grid-template-columns:
repeat(4,minmax(0,1fr));

gap:12px;
}

.card{
background:#171a21;

border:2px solid #2c323d;

border-radius:14px;

padding:7px;

position:relative;

transition:.15s;
}

.card.vote{

border-color:#ef3340;

box-shadow:
0 0 0 2px #ef334055,
0 0 15px #ef334044;

}

.card.dead{
opacity:.55;
}

.video{

width:100%;

aspect-ratio:16/10;

background:#252a34;

border-radius:9px;

overflow:hidden;

position:relative;

display:flex;

align-items:center;

justify-content:center;

}

video{

width:100%;
height:100%;

object-fit:cover;

}

.avatar{

font-size:42px;
color:#777;

}

.status{

position:absolute;

right:6px;
top:6px;

background:#111c;

padding:5px 7px;

border-radius:6px;

font-size:10px;
}

.dead-overlay{

position:absolute;

inset:0;

background:#000b;

display:flex;

align-items:center;
justify-content:center;

font-size:50px;

}

.name{

font-weight:bold;

padding:8px 3px 2px;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

}

.number{

font-size:11px;

color:#8f96a4;

}

.bottom{

margin-top:15px;

padding:12px;

background:#12151b;

border:1px solid #292e38;

border-radius:12px;

display:flex;

align-items:center;

gap:10px;

}

#message{

color:#aaa;

font-size:13px;

}

@media(max-width:900px){

.board{

grid-template-columns:
repeat(4,1fr);

gap:6px;

}

.card{

padding:4px;

}

.name{

font-size:12px;

}

}

@media(max-width:550px){

.board{

grid-template-columns:
repeat(2,1fr);

}

}

</style>

</head>

<body>

<header>

<div class="logo">

🔴 MAFIA <span>ROOM</span>

</div>

<div class="room">

Кімната:

<b id="roomCode">—</b>

</div>

</header>


<main>

<div class="controls" id="joinPanel">

<input
id="nickname"
placeholder="Твій нікнейм"
maxlength="20"
>

<input
id="roomInput"
placeholder="Код кімнати"
maxlength="6"
>

<button
class="red"
onclick="joinRoom()"
>

Увійти в лобі

</button>

</div>


<div
class="controls"
id="hostPanel"
style="display:none"
>

<button
onclick="hostAction('vote')"
>

🔴 На голосування

</button>

<button
onclick="hostAction('dead')"
>

☠️ Вбити

</button>

<button
onclick="hostAction('clear')"
>

↩️ Очистити

</button>

<button
class="green"
onclick="copyInvite()"
>

🔗 Скопіювати запрошення

</button>

</div>


<div
class="board"
id="board"
>

</div>


<div class="bottom">

<span id="message">

Введи нікнейм та код кімнати.

</span>

<span
id="counter"
style="margin-left:auto"
>

0/12

</span>

</div>

</main>


<script>

const socket =
new WebSocket(
(location.protocol === "https:" ? "wss://" : "ws://")
+
location.host
);


let myId = null;

let roomId = "";

let isHost = false;

let selectedPlayer = null;

let players = [];

let connections = {};



/* =========================
   ПРИЄДНАННЯ
========================= */

function joinRoom(){

const name =
document
.getElementById("nickname")
.value
.trim()
||
"Гравець";


roomId =
document
.getElementById("roomInput")
.value
.trim()
.toUpperCase();


if(!roomId){

alert("Введи код кімнати");

return;

}


socket.send(
JSON.stringify({

type:"join",

room:roomId,

name:name

})
);

}



/* =========================
   ПОВІДОМЛЕННЯ СЕРВЕРА
========================= */

socket.onmessage = function(event){

const data =
JSON.parse(event.data);


if(data.type === "error"){

alert(data.message);

return;

}


/* Увійшли */

if(data.type === "joined"){

myId=data.id;

isHost=data.host;


players =
data.players.map(player => ({

id:player.id,

name:player.name,

dead:false,

vote:false

}));


document
.getElementById("joinPanel")
.style.display="none";


if(isHost){

document
.getElementById("hostPanel")
.style.display="flex";

}


document
.getElementById("roomCode")
.textContent=roomId;


render();


startCamera();

}


/* Новий гравець */

if(data.type === "player-joined"){

players.push({

id:data.id,

name:data.name,

dead:false,

vote:false

});


render();

connectToPlayer(
data.id,
true
);

}


/* Вихід */

if(data.type === "player-left"){

players =
players.filter(
player =>
player.id !== data.id
);


if(connections[data.id]){

connections[data.id].close();

delete connections[data.id];

}


render();

}


/* Перейменування */

if(data.type === "renamed"){

const player =
players.find(
p => p.id === data.id
);

if(player){

player.name=data.name;

render();

}

}


/* Дія ведучого */

if(data.type === "host-action"){

const player =
players.find(
p => p.id === data.target
);

if(!player)return;


if(data.action==="vote"){

player.vote=true;

}


if(data.action==="dead"){

player.dead=true;

player.vote=false;

}


if(data.action==="clear"){

player.dead=false;

player.vote=false;

}


render();

}


/* WebRTC */

if(data.type==="signal"){

handleSignal(
data.from,
data.data
);

}

};



/* =========================
   ВІДОБРАЖЕННЯ
========================= */

function render(){

const board =
document.getElementById("board");


board.innerHTML="";


players
.slice(0,12)
.forEach((player,index)=>{


const card =
document.createElement("div");


card.className =
"card "
+
(player.vote ? "vote " : "")
+
(player.dead ? "dead" : "");


card.innerHTML = `

<div class="video">

<video
id="video-${player.id}"
autoplay
playsinline
></video>

<div
class="avatar"
id="avatar-${player.id}"
>
👤
</div>

<div class="status">

${
player.dead
?
"ВИБУВ"
:
player.vote
?
"ГОЛОСУВАННЯ"
:
"ГРАЄ"
}

</div>

${
player.dead
?
'<div class="dead-overlay">☠️</div>'
:
""
}

</div>


<div class="name">

${escapeHTML(player.name)}

</div>


<div class="number">

${index+1}
·
${player.id===myId ? "це ти" : "учасник"}

</div>

`;


card.onclick=function(){

if(!isHost)return;


selectedPlayer =
player.id;


document
.querySelectorAll(".card")
.forEach(
element =>
element.style.outline="none"
);


card.style.outline=
"2px solid white";

};


board.appendChild(card);

});


document
.getElementById("counter")
.textContent=
players.length+"/12";

}



/* =========================
   КАМЕРА
========================= */

async function startCamera(){

try{

const stream =
await navigator
.mediaDevices
.getUserMedia({

video:true,

audio:true

});


const video =
document.getElementById(
"video-"+myId
);


if(video){

video.srcObject=stream;

}


const avatar =
document.getElementById(
"avatar-"+myId
);


if(avatar){

avatar.style.display="none";

}


/* Підключаємо інших */

players.forEach(
player=>{

if(player.id!==myId){

connectToPlayer(
player.id,
true
);

}

});


}

catch(error){

document
.getElementById("message")
.textContent=
"Камера або мікрофон не дозволені.";

}

}



/* =========================
   WEBRTC
========================= */

function connectToPlayer(
playerId,
createOffer
){

if(connections[playerId]){

return;

}


const peer =
new RTCPeerConnection({

iceServers:[

{

urls:
"stun:stun.l.google.com:19302"

}

]

});


connections[playerId]=peer;


const localVideo =
document.getElementById(
"video-"+myId
);


if(
localVideo &&
localVideo.srcObject
){

localVideo
.srcObject
.getTracks()
.forEach(
track=>{

peer.addTrack(
track,
localVideo.srcObject
);

});

}


peer.ontrack=function(event){

const video =
document.getElementById(
"video-"+playerId
);


if(video){

video.srcObject =
event.streams[0];


const avatar =
document.getElementById(
"avatar-"+playerId
);


if(avatar){

avatar.style.display="none";

}

}

};


peer.onicecandidate=function(event){

if(event.candidate){

socket.send(
JSON.stringify({

type:"signal",

to:playerId,

data:{
candidate:event.candidate
}

})
);

}

};


if(createOffer){

peer
.createOffer()
.then(
offer =>
peer
.setLocalDescription(offer)
)
.then(()=>{

socket.send(
JSON.stringify({

type:"signal",

to:playerId,

data:{
sdp:peer.localDescription
}

})
);

});

}

}



/* =========================
   WEBRTC SIGNAL
========================= */

async function handleSignal(
from,
data
){

if(!connections[from]){

connectToPlayer(
from,
false
);

}


const peer =
connections[from];


if(data.sdp){

await peer
.setRemoteDescription(
data.sdp
);


if(
data.sdp.type==="offer"
){

const answer =
await peer.createAnswer();


await peer
.setLocalDescription(
answer
);


socket.send(
JSON.stringify({

type:"signal",

to:from,

data:{
sdp:peer.localDescription
}

})
);

}

}


if(data.candidate){

try{

await peer
.addIceCandidate(
data.candidate
);

}

catch(error){

console.log(error);

}

}

}



/* =========================
   ДІЇ ВЕДУЧОГО
========================= */

function hostAction(action){

if(!isHost){

return;

}


if(!selectedPlayer){

alert(
"Спочатку натисни на гравця."
);

return;

}


socket.send(
JSON.stringify({

type:"host-action",

action:action,

target:selectedPlayer

})
);


selectedPlayer=null;

}



/* =========================
   ЗАПРОШЕННЯ
========================= */

function copyInvite(){

const url =
location.origin
+
"/?room="
+
roomId;


navigator
.clipboard
.writeText(url);


alert(
"Посилання скопійовано!"
);

}



/* =========================
   HTML БЕЗПЕКА
========================= */

function escapeHTML(text){

return text.replace(
/[&<>"']/g,
function(char){

return {

"&":"&amp;",

"<":"&lt;",

">":"&gt;",

'"':"&quot;",

"'":"&#039;"

}[char];

});

}



/* =========================
   КОД З URL
========================= */

const roomFromURL =
new URLSearchParams(
location.search
).get("room");


if(roomFromURL){

document
.getElementById("roomInput")
.value=
roomFromURL;

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mafia Room</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101114;
  color: white;
}

header {
  padding: 14px;
  background: #181a20;
  border-bottom: 1px solid #30333b;
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

input,
button {
  border: 0;
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 14px;
}

input {
  background: #252830;
  color: white;
  outline: none;
}

button {
  cursor: pointer;
  background: #30343d;
  color: white;
}

button:hover {
  background: #414651;
}

button.primary {
  background: #7b1e1e;
}

button.green {
  background: #176b3a;
}

button.danger {
  background: #9e2020;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

#app {
  display: none;
}

.top-info {
  padding: 10px 14px;
  background: #15171c;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.room-code {
  font-weight: bold;
  font-size: 18px;
}

.host-badge {
  background: #a67c00;
  padding: 5px 9px;
  border-radius: 7px;
  font-size: 12px;
}

#players {
  padding: 12px;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-template-rows: repeat(3, minmax(150px, 1fr));
  gap: 10px;
  min-height: calc(100vh - 130px);
}

.player {
  position: relative;
  min-height: 150px;
  background: #1b1e25;
  border: 3px solid transparent;
  border-radius: 12px;
  overflow: hidden;
  user-select: none;
}

.player.dragging {
  opacity: .45;
}

.player.nominated {
  border-color: #ff2525;
  box-shadow: 0 0 16px rgba(255,0,0,.45);
}

.player.dead {
  filter: grayscale(.8);
}

video {
  width: 100%;
  height: 100%;
  min-height: 150px;
  object-fit: cover;
  display: block;
  background: #08090b;
}

.player-info {
  position: absolute;
  left: 8px;
  right: 8px;
  bottom: 8px;
  padding: 8px;
  border-radius: 8px;
  background: rgba(0,0,0,.72);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 5px;
}

.player-name {
  font-weight: bold;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.status {
  font-size: 18px;
}

.dead-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.62);
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 60px;
  z-index: 4;
}

.player.dead .dead-overlay {
  display: flex;
}

.controls {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 8;
  display: flex;
  gap: 5px;
}

.controls button {
  padding: 6px 8px;
  font-size: 12px;
}

.host-controls {
  position: fixed;
  left: 50%;
  bottom: 14px;
  transform: translateX(-50%);
  background: rgba(20,21,25,.95);
  padding: 10px;
  border-radius: 12px;
  border: 1px solid #383b44;
  display: none;
  gap: 7px;
  z-index: 50;
  flex-wrap: wrap;
  justify-content: center;
}

.notice {
  padding: 20px;
  text-align: center;
}

#login {
  max-width: 440px;
  margin: 12vh auto;
  padding: 25px;
  background: #191b21;
  border-radius: 14px;
}

#login h1 {
  margin-top: 0;
}

#login input {
  width: 100%;
  margin-bottom: 10px;
}

#login button {
  width: 100%;
}

.small {
  color: #9da1aa;
  font-size: 13px;
  line-height: 1.5;
}

.connection {
  padding: 5px 8px;
  border-radius: 6px;
  font-size: 12px;
  background: #8b2222;
}

.connection.ok {
  background: #176b3a;
}

@media (max-width: 800px) {
  #players {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: auto;
  }

  .player {
    min-height: 170px;
  }
}

@media (max-width: 500px) {
  header {
    padding: 10px;
  }

  #players {
    padding: 7px;
    gap: 7px;
  }

  .player {
    min-height: 135px;
  }

  video {
    min-height: 135px;
  }

  .host-controls {
    left: 7px;
    right: 7px;
    transform: none;
    bottom: 7px;
  }
}
</style>
</head>

<body>

<div id="login">
  <h1>🎭 Mafia Room</h1>

  <input id="nameInput" placeholder="Твій нікнейм" maxlength="20">

  <input id="roomInput" placeholder="Код кімнати">

  <button class="primary" onclick="joinRoom()">
    Увійти в кімнату
  </button>

  <button onclick="createRoom()">
    Створити нову кімнату
  </button>

  <p class="small">
    Максимум 12 гравців.<br>
    Для камери та мікрофона дозволь браузеру доступ.
  </p>

  <div id="loginError"></div>
</div>

<div id="app">

  <header>

    <strong>🎭 MAFIA</strong>

    <button onclick="copyInvite()">
      🔗 Запросити
    </button>

    <button onclick="renameMe()">
      ✏️ Нік
    </button>

    <button onclick="toggleMic()">
      🎤 Мікрофон
    </button>

    <button onclick="toggleCamera()">
      📹 Камера
    </button>

    <span id="connection" class="connection">
      Підключення...
    </span>

  </header>

  <div class="top-info">

    <span>
      Кімната:
      <span id="roomCode" class="room-code"></span>
    </span>

    <span id="hostBadge"></span>

  </div>

  <div id="players"></div>

  <div id="hostControls" class="host-controls">

    <button class="primary" onclick="hostVote()">
      🗳️ Кандидат
    </button>

    <button class="danger" onclick="hostKill()">
      💀 Вбити
    </button>

    <button onclick="hostClear()">
      ↩️ Очистити
    </button>

    <button onclick="hostMute()">
      🔇 Мікрофон
    </button>

    <button onclick="hostMuteAll()">
      🔇 Всім
    </button>

    <button onclick="transferHost()">
      👑 Передати ведучого
    </button>

  </div>

</div>

<script>
const state = {
  ws: null,
  room: null,
  myId: localStorage.getItem("mafiaPlayerId"),
  name: localStorage.getItem("mafiaName") || "",
  hostId: null,
  players: [],
  localStream: null,
  muted: false,
  cameraOff: false,
  peers: new Map(),
  reconnectTimer: null,
  intentionalClose: false,
  draggedId: null
};

const $ = id => document.getElementById(id);

function randomRoom() {
  return Math.random()
    .toString(36)
    .substring(2, 8)
    .toUpperCase();
}

function getRoomFromUrl() {
  return new URLSearchParams(location.search)
    .get("room");
}

function createRoom() {
  const room = randomRoom();

  $("roomInput").value = room;

  joinRoom();
}

async function joinRoom() {

  const name =
    $("nameInput").value.trim() ||
    state.name ||
    "Гравець";

  const room =
    $("roomInput").value.trim().toUpperCase();

  if (!room) {
    $("loginError").textContent =
      "Введи код кімнати.";
    return;
  }

  state.name = name;
  state.room = room;

  localStorage.setItem(
    "mafiaName",
    state.name
  );

  localStorage.setItem(
    "mafiaRoom",
    state.room
  );

  history.replaceState(
    {},
    "",
    "/?room=" +
    encodeURIComponent(state.room)
  );

  $("login").style.display = "none";
  $("app").style.display = "block";

  $("roomCode").textContent =
    state.room;

  await startMedia();

  connectWebSocket();
}

async function startMedia() {

  if (state.localStream) return;

  try {

    state.localStream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          width: { ideal: 1280 },
          height: { ideal: 720 },
          facingMode: "user"
        },
        audio: true
      });

    state.muted = false;
    state.cameraOff = false;

  } catch (e) {

    console.error(e);

    try {

      state.localStream =
        await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

    } catch {

      try {

        state.localStream =
          await navigator.mediaDevices.getUserMedia({
            video: false,
            audio: true
          });

      } catch {

        state.localStream = null;

      }

    }

  }
}

function connectWebSocket() {

  if (
    state.ws &&
    (
      state.ws.readyState === WebSocket.OPEN ||
      state.ws.readyState === WebSocket.CONNECTING
    )
  ) {
    return;
  }

  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";

  state.ws = new WebSocket(
    protocol +
    "//" +
    location.host
  );

  state.ws.onopen = () => {

    $("connection").textContent =
      "Підключено";

    $("connection").classList.add("ok");

    clearTimeout(state.reconnectTimer);

    send({
      type: "join",
      room: state.room,
      playerId: state.myId,
      name: state.name
    });

  };

  state.ws.onmessage = async event => {

    let m;

    try {
      m = JSON.parse(event.data);
    } catch {
      return;
    }

    await handleMessage(m);

  };

  state.ws.onclose = () => {

    $("connection").textContent =
      "Перепідключення...";

    $("connection").classList.remove("ok");

    if (!state.intentionalClose) {

      clearTimeout(
        state.reconnectTimer
      );

      state.reconnectTimer =
        setTimeout(
          connectWebSocket,
          1500
        );

    }

  };

  state.ws.onerror = () => {
    try {
      state.ws.close();
    } catch {}
  };
}

function send(message) {

  if (
    state.ws &&
    state.ws.readyState === WebSocket.OPEN
  ) {
    state.ws.send(
      JSON.stringify(message)
    );
  }
}

async function handleMessage(m) {

  if (m.type === "error") {

    alert(m.message);

    return;
  }

  if (m.type === "joined") {

    state.myId = m.id;
    state.hostId = m.hostId;

    localStorage.setItem(
      "mafiaPlayerId",
      state.myId
    );

    renderHost();

    return;
  }

  if (m.type === "room-state") {

    state.hostId = m.hostId;
    state.players = m.players || [];

    renderPlayers();
    renderHost();

    await ensurePeers();

    return;
  }

  if (m.type === "signal") {

    await handleSignal(
      m.from,
      m.data
    );

    return;
  }

  if (m.type === "force-mute") {

    if (m.muted !== undefined) {

      state.muted = !!m.muted;

      applyLocalMediaState();

    }

    return;
  }
}

function renderHost() {

  const isHost =
    state.myId === state.hostId;

  $("hostControls").style.display =
    isHost ? "flex" : "none";

  $("hostBadge").innerHTML =
    isHost
      ? '<span class="host-badge">👑 Ти ведучий</span>'
      : "";
}

function renderPlayers() {

  const container = $("players");

  const oldVideos = new Map();

  container
    .querySelectorAll(".player")
    .forEach(el => {

      const video =
        el.querySelector("video");

      if (video && video.srcObject) {

        oldVideos.set(
          el.dataset.id,
          video.srcObject
        );

      }

    });

  container.innerHTML = "";

  state.players.forEach(player => {

    const el =
      document.createElement("div");

    el.className = "player";

    if (player.nominated)
      el.classList.add("nominated");

    if (player.dead)
      el.classList.add("dead");

    el.dataset.id = player.id;

    el.draggable =
      state.myId === state.hostId;

    el.ondragstart = e => {

      state.draggedId =
        player.id;

      el.classList.add("dragging");

      e.dataTransfer.effectAllowed =
        "move";

    };

    el.ondragend = () => {

      el.classList.remove(
        "dragging"
      );

    };

    el.ondragover = e => {

      if (state.myId !== state.hostId)
        return;

      e.preventDefault();

    };

    el.ondrop = e => {

      e.preventDefault();

      if (state.myId !== state.hostId)
        return;

      movePlayer(
        state.draggedId,
        player.id
      );

    };

    const video =
      document.createElement("video");

    video.autoplay = true;
    video.playsInline = true;
    video.muted =
      player.id === state.myId;

    if (player.id === state.myId) {

      if (state.localStream) {
        video.srcObject =
          state.localStream;
      }

    } else if (
      oldVideos.has(player.id)
    ) {

      video.srcObject =
        oldVideos.get(player.id);

    }

    el.appendChild(video);

    const info =
      document.createElement("div");

    info.className =
      "player-info";

    const name =
      document.createElement("span");

    name.className =
      "player-name";

    name.textContent =
      player.name +
      (
        player.id === state.myId
          ? " (ти)"
          : ""
      );

    const status =
      document.createElement("span");

    status.className =
      "status";

    status.textContent =
      player.muted
        ? "🔇"
        : "🎤";

    info.appendChild(name);
    info.appendChild(status);

    el.appendChild(info);

    const dead =
      document.createElement("div");

    dead.className =
      "dead-overlay";

    dead.textContent = "💀";

    el.appendChild(dead);

    if (
      state.myId === state.hostId &&
      player.id !== state.myId
    ) {

      const controls =
        document.createElement("div");

      controls.className =
        "controls";

      const mute =
        document.createElement("button");

      mute.textContent =
        player.muted
          ? "🔊"
          : "🔇";

      mute.onclick = e => {

        e.stopPropagation();

        hostAction(
          "mute",
          player.id
        );

      };

      controls.appendChild(mute);

      el.appendChild(controls);

    }

    container.appendChild(el);

  });

  attachLocalVideo();

}

function attachLocalVideo() {

  const me =
    $("players")
      .querySelector(
        `[data-id="${CSS.escape(state.myId || "")}"]`
      );

  if (!me) return;

  const video =
    me.querySelector("video");

  if (
    video &&
    state.localStream &&
    video.srcObject !== state.localStream
  ) {

    video.srcObject =
      state.localStream;

    video.play().catch(() => {});

  }

}

function movePlayer(fromId, toId) {

  if (!fromId || !toId || fromId === toId)
    return;

  const ids =
    state.players.map(p => p.id);

  const from =
    ids.indexOf(fromId);

  const to =
    ids.indexOf(toId);

  if (from < 0 || to < 0)
    return;

  const item =
    ids.splice(from, 1)[0];

  ids.splice(to, 0, item);

  send({
    type: "order",
    ids
  });

}

async function ensurePeers() {

  for (const player of state.players) {

    if (
      player.id === state.myId ||
      !player.connected
    ) continue;

    if (
      state.peers.has(player.id)
    ) continue;

    await createPeer(
      player.id,
      true
    );

  }

}

async function createPeer(
  peerId,
  initiator
) {

  if (state.peers.has(peerId))
    return state.peers.get(peerId);

  const pc =
    new RTCPeerConnection({
      iceServers: [
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]
    });

  state.peers.set(
    peerId,
    pc
  );

  if (state.localStream) {

    for (
      const track
      of state.localStream.getTracks()
    ) {

      pc.addTrack(
        track,
        state.localStream
      );

    }

  }

  pc.onicecandidate = event => {

    if (event.candidate) {

      send({
        type: "signal",
        to: peerId,
        data: {
          type: "candidate",
          candidate: event.candidate
        }
      });

    }

  };

  pc.ontrack = event => {

    const stream =
      event.streams[0];

    const el =
      $("players")
        .querySelector(
          `[data-id="${CSS.escape(peerId)}"]`
        );

    if (!el) return;

    const video =
      el.querySelector("video");

    if (
      video &&
      video.srcObject !== stream
    ) {

      video.srcObject = stream;

      video.play().catch(() => {});

    }

  };

  pc.onconnectionstatechange = () => {

    if (
      pc.connectionState ===
        "failed" ||
      pc.connectionState ===
        "closed"
    ) {

      state.peers.delete(
        peerId
      );

      try {
        pc.close();
      } catch {}

    }

  };

  if (initiator) {

    const offer =
      await pc.createOffer();

    await pc.setLocalDescription(
      offer
    );

    send({
      type: "signal",
      to: peerId,
      data: {
        type: "offer",
        offer
      }
    });

  }

  return pc;
}

async function handleSignal(
  from,
  data
) {

  let pc =
    state.peers.get(from);

  if (!pc) {

    pc =
      await createPeer(
        from,
        false
      );

  }

  if (data.type === "offer") {

    await pc.setRemoteDescription(
      data.offer
    );

    const answer =
      await pc.createAnswer();

    await pc.setLocalDescription(
      answer
    );

    send({
      type: "signal",
      to: from,
      data: {
        type: "answer",
        answer
      }
    });

  }

  else if (data.type === "answer") {

    await pc.setRemoteDescription(
      data.answer
    );

  }

  else if (data.type === "candidate") {

    try {

      await pc.addIceCandidate(
        data.candidate
      );

    } catch {}

  }

}

function applyLocalMediaState() {

  if (!state.localStream)
    return;

  state.localStream
    .getAudioTracks()
    .forEach(track => {

      track.enabled =
        !state.muted;

    });

  state.localStream
    .getVideoTracks()
    .forEach(track => {

      track.enabled =
        !state.cameraOff;

    });

  renderPlayers();

}

async function toggleMic() {

  if (!state.localStream) {

    await startMedia();

  }

  if (!state.localStream) {

    alert(
      "Не вдалося отримати доступ до мікрофона."
    );

    return;

  }

  state.muted =
    !state.muted;

  applyLocalMediaState();

}

async function toggleCamera() {

  if (!state.localStream) {

    await startMedia();

  }

  if (!state.localStream) {

    alert(
      "Не вдалося отримати доступ до камери."
    );

    return;

  }

  const tracks =
    state.localStream.getVideoTracks();

  if (!tracks.length) {

    try {

      const extra =
        await navigator.mediaDevices
          .getUserMedia({
            video: true
          });

      extra.getVideoTracks()
        .forEach(track => {

          state.localStream.addTrack(
            track
          );

        });

    } catch {

      alert(
        "Браузер не дозволив доступ до камери."
      );

      return;

    }

  }

  state.cameraOff =
    !state.cameraOff;

  applyLocalMediaState();

  reconnectVideoTracks();

}

async function reconnectVideoTracks() {

  for (const [
    id,
    pc
  ] of state.peers) {

    const senders =
      pc.getSenders();

    const videoTrack =
      state.localStream
        ?.getVideoTracks()[0];

    const sender =
      senders.find(
        s =>
          s.track?.kind === "video"
      );

    if (
      sender &&
      videoTrack
    ) {

      try {

        await sender.replaceTrack(
          videoTrack
        );

      } catch {}

    }

  }

}

function hostAction(
  action,
  target
) {

  send({
    type: "host-action",
    action,
    target
  });

}

function selectedPlayer() {

  return state.players.find(
    p =>
      p.nominated &&
      p.id !== state.myId
  );

}

function hostVote() {

  const target =
    promptPlayer();

  if (target)
    hostAction(
      "vote",
      target
    );

}

function hostKill() {

  const target =
    promptPlayer();

  if (target)
    hostAction(
      "kill",
      target
    );

}

function hostClear() {

  const target =
    promptPlayer();

  if (target)
    hostAction(
      "clear",
      target
    );

}

function hostMute() {

  const target =
    promptPlayer();

  if (target)
    hostAction(
      "mute",
      target
    );

}

function promptPlayer() {

  const list =
    state.players
      .filter(
        p => p.id !== state.myId
      )
      .map(
        (p, i) =>
          `${i + 1}. ${p.name}`
      )
      .join("\n");

  if (!list) return null;

  const answer =
    prompt(
      "Вибери номер гравця:\n\n" +
      list
    );

  const index =
    Number(answer) - 1;

  const players =
    state.players.filter(
      p => p.id !== state.myId
    );

  return players[index]?.id || null;

}

function hostMuteAll() {

  hostAction(
    "mute-all",
    null
  );

}

function transferHost() {

  const target =
    promptPlayer();

  if (target) {

    hostAction(
      "transfer-host",
      target
    );

  }

}

async function renameMe() {

  const newName =
    prompt(
      "Новий нік:",
      state.name
    );

  if (!newName)
    return;

  state.name =
    newName.trim().slice(0, 20);

  localStorage.setItem(
    "mafiaName",
    state.name
  );

  send({
    type: "rename",
    name: state.name
  });

}

async function copyInvite() {

  const url =
    location.origin +
    "/?room=" +
    encodeURIComponent(
      state.room
    );

  try {

    await navigator.clipboard.writeText(
      url
    );

    alert(
      "Посилання скопійовано!"
    );

  } catch {

    prompt(
      "Скопіюй посилання:",
      url
    );

  }

}

window.addEventListener(
  "beforeunload",
  () => {

    state.intentionalClose = true;

  }
);

window.addEventListener(
  "load",
  async () => {

    const room =
      getRoomFromUrl() ||
      localStorage.getItem(
        "mafiaRoom"
      );

    const savedName =
      localStorage.getItem(
        "mafiaName"
      );

    if (savedName)
      $("nameInput").value =
        savedName;

    if (room) {

      $("roomInput").value =
        room;

    }

  }
);

setInterval(() => {

  if (
    state.ws &&
    state.ws.readyState === WebSocket.OPEN
  ) {

    send({
      type: "ping"
    });

  }

}, 10000);

</script>

</body>
</html>

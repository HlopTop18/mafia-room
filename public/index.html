<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video Room</title>

    <!-- LiveKit -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
        }

        body {
            overflow: hidden;
        }

        /* =========================
           LOGIN
        ========================= */

        #loginScreen {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at top, #273449, #111827 60%);
        }

        .login-box {
            width: min(420px, calc(100% - 30px));
            padding: 30px;
            border-radius: 20px;
            background: #1f2937;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .login-box h1 {
            margin: 0 0 8px;
            text-align: center;
        }

        .login-box p {
            margin: 0 0 25px;
            text-align: center;
            color: #9ca3af;
        }

        .field {
            margin-bottom: 15px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            color: #d1d5db;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #374151;
            border-radius: 10px;
            outline: none;
            background: #111827;
            color: white;
            font-size: 16px;
        }

        input:focus {
            border-color: #60a5fa;
        }

        #joinButton {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #joinButton:hover {
            background: #1d4ed8;
        }

        #errorMessage {
            margin-top: 15px;
            color: #f87171;
            text-align: center;
            min-height: 20px;
        }

        /* =========================
           APP
        ========================= */

        #app {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            height: 65px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            background: #1f2937;
            border-bottom: 1px solid #374151;
        }

        .room-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .room-title strong {
            font-size: 17px;
        }

        .room-status {
            color: #9ca3af;
            font-size: 13px;
        }

        .participants-count {
            color: #9ca3af;
            font-size: 14px;
        }

        /* =========================
           VIDEO AREA
        ========================= */

        #videoGrid {
            flex: 1;
            min-height: 0;
            padding: 12px;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-template-rows: repeat(3, minmax(0, 1fr));
            gap: 12px;
            overflow-y: auto;
        }

        .video-card {
            position: relative;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            border-radius: 14px;
            background: #0b1220;
            border: 1px solid #374151;
        }

        .video-card video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            background: #0b1220;
        }

        .video-card.no-video video {
            display: none;
        }

        .avatar {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #172033;
            font-size: clamp(35px, 5vw, 70px);
            font-weight: bold;
            color: #9ca3af;
        }

        .video-card:not(.no-video) .avatar {
            display: none;
        }

        .participant-name {
            position: absolute;
            left: 10px;
            bottom: 10px;
            max-width: calc(100% - 20px);
            padding: 6px 9px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.65);
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mic-status {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.65);
            font-size: 15px;
        }

        .local-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 5px 8px;
            border-radius: 7px;
            background: rgba(37, 99, 235, 0.9);
            font-size: 11px;
        }

        /* =========================
           CONTROLS
        ========================= */

        .controls {
            height: 78px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            background: #1f2937;
            border-top: 1px solid #374151;
        }

        .control-button {
            width: 52px;
            height: 52px;
            border: 0;
            border-radius: 50%;
            background: #374151;
            color: white;
            font-size: 21px;
            cursor: pointer;
            transition: 0.15s;
        }

        .control-button:hover {
            background: #4b5563;
        }

        .control-button.active {
            background: #2563eb;
        }

        .control-button.off {
            background: #dc2626;
        }

        #leaveButton {
            width: auto;
            padding: 0 20px;
            border-radius: 26px;
            background: #dc2626;
            font-size: 15px;
        }

        #leaveButton:hover {
            background: #b91c1c;
        }

        /* =========================
           VOLUME PANEL
        ========================= */

        #volumePanel {
            position: fixed;
            right: 15px;
            bottom: 95px;
            width: 260px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
            padding: 15px;
            border-radius: 14px;
            background: #1f2937;
            border: 1px solid #374151;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            z-index: 100;
        }

        #volumePanel h3 {
            margin: 0 0 14px;
            font-size: 15px;
        }

        .volume-row {
            margin-bottom: 14px;
        }

        .volume-name {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 13px;
            color: #d1d5db;
        }

        .volume-row input[type="range"] {
            width: 100%;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 900px) {
            #videoGrid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                grid-template-rows: repeat(6, minmax(0, 1fr));
            }
        }

        @media (max-width: 600px) {
            .header {
                height: 55px;
            }

            .room-status {
                display: none;
            }

            #videoGrid {
                padding: 7px;
                gap: 7px;
            }

            .controls {
                height: 70px;
            }

            .control-button {
                width: 46px;
                height: 46px;
                font-size: 18px;
            }

            #leaveButton {
                padding: 0 14px;
                font-size: 13px;
            }
        }

        /* =========================
           MAFIA HOST CONTROLS
        ========================= */

        .host-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 5px 8px;
            border-radius: 7px;
            background: rgba(245, 158, 11, 0.95);
            color: #111827;
            font-size: 11px;
            font-weight: bold;
            z-index: 8;
        }

        .video-card.game-highlight {
            border: 3px solid #ef4444 !important;
            box-shadow: 0 0 18px rgba(239, 68, 68, 0.45);
        }

        .video-card.dragging {
            opacity: 0.45;
        }

        .video-card.drag-over {
            outline: 3px dashed #60a5fa;
            outline-offset: -3px;
        }

        .dead-overlay {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.78);
            color: #ef4444;
            font-size: clamp(30px, 6vw, 70px);
            font-weight: 900;
            letter-spacing: 4px;
            text-shadow: 0 4px 15px rgba(0,0,0,.8);
        }

        .video-card.dead .dead-overlay {
            display: flex;
        }

        .video-card.dead video {
            filter: grayscale(1) brightness(0.35);
        }

        .host-panel-button {
            display: none;
        }

        .host-menu {
            position: fixed;
            z-index: 1000;
            width: 230px;
            display: none;
            padding: 7px;
            border-radius: 12px;
            background: #1f2937;
            border: 1px solid #4b5563;
            box-shadow: 0 18px 50px rgba(0,0,0,.55);
        }

        .host-menu-title {
            padding: 8px 10px;
            font-weight: bold;
            border-bottom: 1px solid #374151;
            margin-bottom: 6px;
        }

        .host-menu button {
            width: 100%;
            border: 0;
            background: transparent;
            color: white;
            text-align: left;
            padding: 9px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .host-menu button:hover {
            background: #374151;
        }

        .host-menu button.danger:hover {
            background: #7f1d1d;
        }

        #hostPanelButton {
            display: none;
            width: auto;
            padding: 0 15px;
            border-radius: 24px;
            font-size: 14px;
            background: #92400e;
        }

        #hostPanelButton:hover {
            background: #b45309;
        }

        .host-panel {
            position: fixed;
            z-index: 900;
            top: 75px;
            left: 15px;
            width: 280px;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            display: none;
            padding: 14px;
            border-radius: 14px;
            background: #1f2937;
            border: 1px solid #374151;
            box-shadow: 0 15px 40px rgba(0,0,0,.45);
        }

        .host-panel h3 {
            margin: 0 0 10px;
            font-size: 15px;
        }

        .host-panel p {
            margin: 0 0 12px;
            color: #9ca3af;
            font-size: 12px;
        }

        .host-player-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 0;
            border-bottom: 1px solid #374151;
        }

        .host-player-row:last-child {
            border-bottom: 0;
        }

        .host-player-name {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 13px;
        }

        .host-player-actions {
            display: flex;
            gap: 5px;
        }

        .host-player-actions button {
            border: 0;
            border-radius: 7px;
            background: #374151;
            color: white;
            cursor: pointer;
            padding: 6px 7px;
            font-size: 12px;
        }

        .host-player-actions button:hover {
            background: #4b5563;
        }

        @media (max-width: 600px) {
            .host-panel {
                left: 7px;
                right: 7px;
                width: auto;
            }

            .host-menu {
                width: min(235px, calc(100vw - 20px));
            }
        }

    </style>
</head>

<body>

<!-- =========================
     LOGIN SCREEN
========================= -->

<div id="loginScreen">

    <div class="login-box">

</div>

<div id="hostMenu" class="host-menu">

    <div id="hostMenuTitle" class="host-menu-title">
        Учасник
    </div>

    <button id="hostKillButton">
        ☠️ Вбити
    </button>

    <button id="hostReviveButton">
        ↩️ Воскресити
    </button>

    <button id="hostMuteButton">
        🔇 Вимкнути мікрофон
    </button>

    <button id="hostUnmuteButton">

    </button>

    <button id="hostHighlightButton">
        🔴 Виділити
    </button>

    <button id="hostUnhighlightButton">
        ⚪ Зняти виділення
    </button>

        👁️ Приховати камеру
    </button>

        📹 Показати камеру
    </button>

<script>

    /* =====================================================
       GLOBAL VARIABLES
    ===================================================== */

    let room = null;

    let roomName = "";
    let participantName = "";

    let ws = null;

    const videoElements = new Map();
    const audioElements = new Map();
    const participantCards = new Map();

    let leaving = false;

    let isHost = false;
    let hostStates = new Map();
    let roomOrder = [];
    let selectedHostTarget = null;
    let draggedIdentity = null;


    /* =====================================================
       DOM
    ===================================================== */

    const loginScreen =
        document.getElementById("loginScreen");

    const app =
        document.getElementById("app");

    const roomInput =
        document.getElementById("roomInput");

    const nameInput =
        document.getElementById("nameInput");

    const joinButton =
        document.getElementById("joinButton");

    const errorMessage =
        document.getElementById("errorMessage");

    const videoGrid =
        document.getElementById("videoGrid");

    const roomNameDisplay =
        document.getElementById("roomNameDisplay");

    const connectionStatus =
        document.getElementById("connectionStatus");

    const participantsCount =
        document.getElementById("participantsCount");

    const cameraButton =
        document.getElementById("cameraButton");

    const micButton =
        document.getElementById("micButton");

    const volumeButton =
        document.getElementById("volumeButton");

    const leaveButton =
        document.getElementById("leaveButton");

    const volumePanel =
        document.getElementById("volumePanel");

    const volumeList =
        document.getElementById("volumeList");

    const hostPanelButton =
        document.getElementById("hostPanelButton");

    const hostPanel =
        document.getElementById("hostPanel");

    const hostPlayersList =
        document.getElementById("hostPlayersList");

    const hostMenu =
        document.getElementById("hostMenu");

    const hostMenuTitle =
        document.getElementById("hostMenuTitle");


    /* =====================================================
       HELPERS
    ===================================================== */

    function escapeHtml(value) {

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }


    function getInitial(name) {

        if (!name) {
            return "?";
        }

        return name.trim().charAt(0).toUpperCase();

    }


    function showError(message) {

        errorMessage.textContent = message;

    }


    function clearError() {

        errorMessage.textContent = "";

    }


    /* =====================================================
       CREATE PARTICIPANT CARD
    ===================================================== */

    function createParticipantCard(
        identity,
        name,
        isLocal = false
    ) {

        if (participantCards.has(identity)) {

            return participantCards.get(identity);

        }

        const card =
            document.createElement("div");

        card.className =
            "video-card no-video";

        card.dataset.identity =
            identity;

        card.innerHTML = `

            <div class="avatar">
                ${escapeHtml(getInitial(name))}
            </div>

            <video
                autoplay
                playsinline
                muted="${isLocal ? "true" : "false"}"
            ></video>

            <div class="participant-name">
                ${escapeHtml(name)}
            </div>

            <div class="mic-status">
                🎤
            </div>

            <div class="dead-overlay">
                ВБИТО
            </div>

            ${
                isLocal
                    ? `<div class="local-badge">Ви</div>`
                    : ""
            }

        `;

        videoGrid.appendChild(card);

        card.draggable = true;

        card.addEventListener(
            "dragstart",
            event => {

                if (!isHost) {
                    event.preventDefault();
                    return;
                }

                draggedIdentity =
                    identity;

                card.classList.add(
                    "dragging"
                );

                event.dataTransfer.effectAllowed =
                    "move";

            }
        );

        card.addEventListener(
            "dragend",
            () => {

                draggedIdentity = null;

                card.classList.remove(
                    "dragging"
                );

                document
                    .querySelectorAll(
                        ".drag-over"
                    )
                    .forEach(
                        el =>
                            el.classList.remove(
                                "drag-over"
                            )
                    );

            }
        );

        card.addEventListener(
            "dragover",
            event => {

                if (
                    !isHost ||
                    !draggedIdentity ||
                    draggedIdentity === identity
                ) {
                    return;
                }

                event.preventDefault();

                card.classList.add(
                    "drag-over"
                );

            }
        );

        card.addEventListener(
            "dragleave",
            () => {

                card.classList.remove(
                    "drag-over"
                );

            }
        );

        card.addEventListener(
            "drop",
            event => {

                if (
                    !isHost ||
                    !draggedIdentity ||
                    draggedIdentity === identity
                ) {
                    return;
                }

                event.preventDefault();

                card.classList.remove(
                    "drag-over"
                );

                moveParticipantBefore(
                    draggedIdentity,
                    identity
                );

            }
        );

        card.addEventListener(
            "contextmenu",
            event => {

                if (
                    !isHost ||
                    identity === participantName
                ) {
                    return;
                }

                event.preventDefault();

                openHostMenu(
                    identity,
                    event.clientX,
                    event.clientY
                );

            }
        );

        participantCards.set(
            identity,
            card
        );

        getPlayerState(identity);

        applyRoomOrder();

        applyPlayerState(identity);

        updateParticipantCount();

        return card;

    }


    /* =====================================================
       MAFIA GAME STATE / HOST
    ===================================================== */

    let currentHostIdentity = null;


    function updateHostBadges() {

        participantCards.forEach(
            (card, identity) => {

                const old =
                    card.querySelector(
                        ".host-badge"
                    );

                if (old) {
                    old.remove();
                }

                if (
                    identity ===
                    currentHostIdentity
                ) {

                    const badge =
                        document.createElement(
                            "div"
                        );

                    badge.className =
                        "host-badge";

                    badge.textContent =
                        "👑 ВЕДУЧИЙ";

                    card.appendChild(
                        badge
                    );

                }

            }
        );

    }


    function getPlayerState(identity) {

        if (
            !hostStates.has(identity)
        ) {

            hostStates.set(
                identity,
                {
                    alive: true,
                    mutedByHost: false,
                    highlighted: false,
                    cameraKilled: false
                }
            );

        }

        return hostStates.get(
            identity
        );

    }


    function applyPlayerState(identity) {

        const card =
            participantCards.get(
                identity
            );

        if (!card) {
            return;
        }

        const state =
            getPlayerState(identity);

        card.classList.toggle(
            "dead",
            !state.alive ||
            state.cameraKilled
        );

        card.classList.toggle(
            "game-highlight",
            !!state.highlighted
        );

        const micStatus =
            card.querySelector(
                ".mic-status"
            );

        if (micStatus) {

            micStatus.textContent =
                state.mutedByHost
                    ? "🔇"
                    : (
                        state.alive
                            ? "🎤"
                            : "☠️"
                    );

        }

    }


    function applyAllStates() {

        participantCards.forEach(
            (_, identity) =>
                applyPlayerState(identity)
        );

        renderHostPanel();

        applyRoomOrder();

    }

        ws.send(
            JSON.stringify({
                type: "host-action",

            })

    function moveParticipantBefore(
        fromIdentity,
        toIdentity
    ) {

        if (
            !isHost ||
            fromIdentity === toIdentity
        ) {
            return;
        }

        const order =
            getCurrentOrder();

        const fromIndex =
            order.indexOf(
                fromIdentity
            );

        const toIndex =
            order.indexOf(
                toIdentity
            );

        if (
            fromIndex < 0 ||
            toIndex < 0
        ) {
            return;
        }

        order.splice(
            fromIndex,
            1
        );

        const newToIndex =
            order.indexOf(
                toIdentity
            );

        order.splice(
            newToIndex,
            0,
            fromIdentity
        );

        roomOrder =
            order;

        applyRoomOrder();

        if (
            ws &&
            ws.readyState ===
                WebSocket.OPEN
        ) {

            ws.send(
                JSON.stringify({
                    type: "host-action",
                    action: "order",
                    order
                })
            );

        }

    }


    function getCurrentOrder() {

        const ids =
            Array.from(
                participantCards.keys()
            );

        const known =
            roomOrder.filter(
                id => ids.includes(id)
            );

        ids.forEach(
            id => {

                if (
                    !known.includes(id)
                ) {
                    known.push(id);
                }

            }
        );

        return known;

    }


    function applyRoomOrder() {

        const order =
            getCurrentOrder();

        roomOrder =
            order;

        order.forEach(
            identity => {

                const card =
                    participantCards.get(
                        identity
                    );

                if (card) {
                    videoGrid.appendChild(
                        card
                    );
                }

            }
        );

    }


    /* =====================================================
       REMOVE PARTICIPANT CARD
    ===================================================== */

    function removeParticipantCard(
        identity
    ) {

        const card =
            participantCards.get(
                identity
            );

        if (!card) {
            return;
        }

        const video =
            card.querySelector(
                "video"
            );

        if (video) {

            try {
                video.pause();
            } catch {}

            video.srcObject =
                null;

        }

        card.remove();

        participantCards.delete(
            identity
        );

        videoElements.delete(
            identity
        );

        audioElements.delete(
            identity
        );

        updateParticipantCount();

        updateVolumeList();

    }


    /* =====================================================
       VIDEO ATTACH
    ===================================================== */

    function attachVideoTrack(
        track,
        participant
    ) {

        const identity =
            participant.identity;

        const name =
            participant.name ||
            participant.identity;

        const card =
            createParticipantCard(
                identity,
                name,
                participant.isLocal
            );

        const video =
            card.querySelector(
                "video"
            );

        if (!video) {
            return;
        }

        try {

            track.detach();

        } catch {}

        track.attach(
            video
        );

        video.autoplay =
            true;

        video.playsInline =
            true;

        if (
            participant.isLocal
        ) {

            video.muted =
                true;

        }

        card.classList.remove(
            "no-video"
        );

        videoElements.set(
            identity,
            video
        );

        const state =
            getPlayerState(
                identity
            );

        if (
            state.cameraKilled
        ) {

            card.classList.add(
                "dead"
            );

        }

        applyPlayerState(
            identity
        );

    }


    function detachVideoTrack(
        track,
        participant
    ) {

        const identity =
            participant.identity;

        const video =
            videoElements.get(
                identity
            );

        if (video) {

            try {

                track.detach(
                    video
                );

            } catch {}

            video.srcObject =
                null;

        }

        videoElements.delete(
            identity
        );

        const card =
            participantCards.get(
                identity
            );

        if (card) {

            card.classList.add(
                "no-video"
            );

        }

    }


    /* =====================================================
       AUDIO ATTACH
    ===================================================== */

    function attachAudioTrack(
        track,
        participant
    ) {

        const identity =
            participant.identity;

        if (
            audioElements.has(
                identity
            )
        ) {

            const old =
                audioElements.get(
                    identity
                );

            try {
                old.pause();
            } catch {}

            old.remove();

        }

        const audio =
            document.createElement(
                "audio"
            );

        audio.autoplay =
            true;

        audio.playsInline =
            true;

        audio.volume =
            1;

        track.attach(
            audio
        );

        document.body.appendChild(
            audio
        );

        audioElements.set(
            identity,
            audio
        );

        updateVolumeList();

    }


    function detachAudioTrack(
        track,
        participant
    ) {

        const audio =
            audioElements.get(
                participant.identity
            );

        if (audio) {

            try {

                track.detach(
                    audio
                );

            } catch {}

            audio.srcObject =
                null;

            audio.remove();

        }

        audioElements.delete(
            participant.identity
        );

        updateVolumeList();

    }


    /* =====================================================
       UPDATE MIC ICON
    ===================================================== */

    function updateParticipantMic(
        participant
    ) {

        const card =
            participantCards.get(
                participant.identity
            );

        if (!card) {
            return;
        }

        const micStatus =
            card.querySelector(
                ".mic-status"
            );

        if (!micStatus) {
            return;
        }

        if (
            participant.isMicrophoneEnabled
        ) {

            micStatus.textContent =
                "🎤";

            micStatus.style.opacity =
                "1";

        } else {

            micStatus.textContent =
                "🔇";

            micStatus.style.opacity =
                "0.9";

        }

    }

    /* =====================================================
       VOLUME LIST
    ===================================================== */

    function updateVolumeList() {

        volumeList.innerHTML =
            "";

        audioElements.forEach(
            (audio, identity) => {

                let name =
                    identity;

                const participant =
                    room?.getParticipantByIdentity(
                        identity
                    );

                if (participant) {

                    name =
                        participant.name ||
                        participant.identity;

                }

                const row =
                    document.createElement(
                        "div"
                    );

                row.className =
                    "volume-row";

                const currentVolume =
                    Math.round(
                        audio.volume * 100
                    );

                row.innerHTML = `

                    <div class="volume-name">

                        <span>
                            ${escapeHtml(name)}
                        </span>

                        <span>
                            ${currentVolume}%
                        </span>

                    </div>

                    <input
                        type="range"
                        min="0"
                        max="100"
                        value="${currentVolume}"
                    >

                `;

                const slider =
                    row.querySelector(
                        'input[type="range"]'
                    );

                slider.addEventListener(
                    "input",
                    () => {

                        const value =
                            Number(
                                slider.value
                            );

                        audio.volume =
                            value / 100;

                        row.querySelector(
                            ".volume-name span:last-child"
                        ).textContent =
                            `${value}%`;

                    }
                );

                volumeList.appendChild(
                    row
                );

            }
        );

    /* =====================================================
       ADD EXISTING PARTICIPANTS
    ===================================================== */

    function renderExistingParticipants() {

        if (!room) {
            return;
        }

        const local =
            room.localParticipant;

        createParticipantCard(
            local.identity,
            local.name ||
                local.identity,
            true
        );

        updateParticipantMic(
            local
        );

        room.remoteParticipants.forEach(
            participant => {

                createParticipantCard(
                    participant.identity,
                    participant.name ||
                        participant.identity,
                    false
                );

                updateParticipantMic(
                    participant
                );

                participant.trackPublications
                    .forEach(
                        publication => {

                            if (
                                publication.isSubscribed &&
                                publication.track
                            ) {

                                if (
                                    publication.kind ===
                                    LivekitClient.Track.Kind.Video
                                ) {

                                    attachVideoTrack(
                                        publication.track,
                                        participant
                                    );

                                }

                                if (
                                    publication.kind ===
                                    LivekitClient.Track.Kind.Audio
                                ) {

                                    attachAudioTrack(
                                        publication.track,
                                        participant
                                    );

                                }

                            }

                        }
                    );

            }
        );

        updateParticipantCount();

    }
        /* =====================================================
       CONNECT TO LIVEKIT
    ===================================================== */

    async function connectToLiveKit() {

        try {

            connectionStatus.textContent =
                "Підключення до LiveKit...";

            const response =
                await fetch(
                    "/api/livekit-token",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            roomName,
                            participantName
                        })
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Не вдалося отримати LiveKit token"
                );

            }

            room =
                new LivekitClient.Room({
                    adaptiveStream: true,
                    dynacast: true
                });

            setupLiveKitEvents();

            await room.connect(
                data.url,
                data.token
            );

            connectionStatus.textContent =
                "🟢 Підключено";

            isHost =
                !!data.host;

            currentHostIdentity =
                data.host
                    ? participantName
                    : null;

            createParticipantCard(
                room.localParticipant.identity,
                room.localParticipant.name ||
                    room.localParticipant.identity,
                true
            );

            await room.localParticipant
                .setCameraEnabled(true);

            await room.localParticipant
                .setMicrophoneEnabled(true);

            updateControls();

            renderExistingParticipants();

            updateHostBadges();

            connectWebSocket();

        } catch (error) {

            console.error(
                "LiveKit connection error:",
                error
            );

            showError(
                error.message ||
                "Не вдалося підключитися"
            );

            await leaveRoom();

        }

    }


    /* =====================================================
       LIVEKIT EVENTS
    ===================================================== */

    function setupLiveKitEvents() {

        if (!room) {
            return;
        }

        room.on(
            LivekitClient.RoomEvent.ParticipantConnected,
            participant => {

                createParticipantCard(
                    participant.identity,
                    participant.name ||
                        participant.identity,
                    false
                );

                updateParticipantMic(
                    participant
                );

                updateParticipantCount();

            }
        );


        room.on(
            LivekitClient.RoomEvent.ParticipantDisconnected,
            participant => {

                removeParticipantCard(
                    participant.identity
                );

                updateParticipantCount();

            }
        );


        room.on(
            LivekitClient.RoomEvent.TrackSubscribed,
            (
                track,
                publication,
                participant
            ) => {

                if (
                    track.kind ===
                    LivekitClient.Track.Kind.Video
                ) {

                    attachVideoTrack(
                        track,
                        participant
                    );

                }

                if (
                    track.kind ===
                    LivekitClient.Track.Kind.Audio
                ) {

                    attachAudioTrack(
                        track,
                        participant
                    );

                }

                updateParticipantMic(
                    participant
                );

            }
        );


        room.on(
            LivekitClient.RoomEvent.TrackUnsubscribed,
            (
                track,
                publication,
                participant
            ) => {

                if (
                    track.kind ===
                    LivekitClient.Track.Kind.Video
                ) {

                    detachVideoTrack(
                        track,
                        participant
                    );

                }

                if (
                    track.kind ===
                    LivekitClient.Track.Kind.Audio
                ) {

                    detachAudioTrack(
                        track,
                        participant
                    );

                }

            }
        );


        room.on(
            LivekitClient.RoomEvent.LocalTrackPublished,
            publication => {

                if (
                    publication.track
                ) {

                    if (
                        publication.kind ===
                        LivekitClient.Track.Kind.Video
                    ) {

                        attachVideoTrack(
                            publication.track,
                            room.localParticipant
                        );

                    }

                    if (
                        publication.kind ===
                        LivekitClient.Track.Kind.Audio
                    ) {

                        updateParticipantMic(
                            room.localParticipant
                        );

                    }

                }

                updateControls();

            }
        );


        room.on(
            LivekitClient.RoomEvent.LocalTrackUnpublished,
            publication => {

                if (
                    publication.kind ===
                    LivekitClient.Track.Kind.Video
                ) {

                    detachVideoTrack(
                        publication.track,
                        room.localParticipant
                    );

                }

                updateControls();

            }
        );


        room.on(
            LivekitClient.RoomEvent.TrackMuted,
            (
                publication,
                participant
            ) => {

                updateParticipantMic(
                    participant
                );

            }
        );


        room.on(
            LivekitClient.RoomEvent.TrackUnmuted,
            (
                publication,
                participant
            ) => {

                updateParticipantMic(
                    participant
                );

            }
        );


        room.on(
            LivekitClient.RoomEvent.ActiveSpeakersChanged,
            speakers => {

                participantCards.forEach(
                    card => {

                        card.classList.remove(
                            "speaking"
                        );

                    }
                );

                speakers.forEach(
                    participant => {

                        const card =
                            participantCards.get(
                                participant.identity
                            );

                        if (card) {

                            card.classList.add(
                                "speaking"
                            );

                        }

                    }
                );

            }
        );


        room.on(
            LivekitClient.RoomEvent.Disconnected,
            () => {

                connectionStatus.textContent =
                    "🔴 Відключено";

            }
        );

    }


    /* =====================================================
       WEBSOCKET
    ===================================================== */

    function connectWebSocket() {

        if (ws) {

            try {
                ws.close();
            } catch {}

        }

        const protocol =
            location.protocol === "https:"
                ? "wss:"
                : "ws:";

        ws =
            new WebSocket(
                `${protocol}//${location.host}/ws`
            );


        ws.addEventListener(
            "open",
            () => {

                ws.send(
                    JSON.stringify({
                        type: "join",
                        roomName,
                        playerName:
                            participantName
                    })
                );

            }
        );


        ws.addEventListener(
            "message",
            event => {

                try {

                    const message =
                        JSON.parse(
                            event.data
                        );

                    handleWebSocketMessage(
                        message
                    );

                } catch (error) {

                    console.error(
                        "WebSocket parse error:",
                        error
                    );

                }

            }
        );


        ws.addEventListener(
            "close",
            () => {

                if (!leaving) {

                    connectionStatus.textContent =
                        "🟡 Сигнал кімнати втрачено";

                }

            }
        );


        ws.addEventListener(
            "error",
            error => {

                console.error(
                    "WebSocket error:",
                    error
                );

            }
        );

    }


    /* =====================================================
       WEBSOCKET MESSAGE HANDLER
    ===================================================== */

    function handleWebSocketMessage(
        message
    ) {

        if (
            message.type ===
            "error"
        ) {

            showError(
                message.message ||
                "Помилка кімнати"
            );

            return;

        }


        if (
            message.type ===
            "room-info"
        ) {

            currentHostIdentity =
                message.host ||
                null;

            isHost =
                currentHostIdentity ===
                participantName;

            hostStates =
                new Map(
                    Object.entries(
                        message.states || {}
                    )
                );

            roomOrder =
                Array.isArray(
                    message.order
                )
                    ? message.order
                    : [];

            updateHostBadges();

            applyAllStates();

            renderHostPanel();

            return;

        }


        if (
            message.type ===
            "host-changed"
        ) {

            currentHostIdentity =
                message.host ||
                null;

            isHost =
                currentHostIdentity ===
                participantName;

            updateHostBadges();

            renderHostPanel();

            applyAllStates();

            return;

        }


        if (
            message.type ===
            "player-joined"
        ) {

            updateParticipantCount();

            return;

        }


        if (
            message.type ===
            "player-left"
        ) {

            if (
                message.playerName
            ) {

                removeParticipantCard(
                    message.playerName
                );

            }

            if (
                message.host
            ) {

                currentHostIdentity =
                    message.host;

                isHost =
                    currentHostIdentity ===
                    participantName;

            }

            if (
                message.states
            ) {

                hostStates =
                    new Map(
                        Object.entries(
                            message.states
                        )
                    );

            }

            if (
                Array.isArray(
                    message.order
                )
            ) {

                roomOrder =
                    message.order;

            }

            updateHostBadges();

            applyAllStates();

            return;

        }


        if (
            message.type ===
            "state-update"
        ) {

            if (
                message.target
            ) {

                hostStates.set(
                    message.target,
                    message.state
                );

                applyPlayerState(
                    message.target
                );

            }

            renderHostPanel();

            return;

        }


        if (
            message.type ===
            "room-order"
        ) {

            if (
                Array.isArray(
                    message.order
                )
            ) {

                roomOrder =
                    message.order;

                applyRoomOrder();

            }

            return;

        }


        if (
            message.type ===
            "host-kick"
        ) {

            if (
                message.target ===
                participantName
            ) {

                alert(
                    "Вас вигнав ведучий."
                );

                leaveRoom();

            }

            return;

        }

    }


    /* =====================================================
       JOIN ROOM
    ===================================================== */

    async function joinRoom() {

        clearError();

        const enteredRoom =
            roomInput.value.trim();

        const enteredName =
            nameInput.value.trim();

        if (!enteredRoom) {

            showError(
                "Введи назву кімнати"
            );

            roomInput.focus();

            return;

        }

        if (!enteredName) {

            showError(
                "Введи своє ім'я"
            );

            nameInput.focus();

            return;

        }

        roomName =
            enteredRoom;

        participantName =
            enteredName;

        leaving =
            false;

        joinButton.disabled =
            true;

        joinButton.textContent =
            "Підключення...";

        roomNameDisplay.textContent =
            `🎭 ${roomName}`;

        loginScreen.style.display =
            "none";

        app.style.display =
            "flex";

        try {

            await connectToLiveKit();

        } catch (error) {

            console.error(
                error
            );

            loginScreen.style.display =
                "flex";

            app.style.display =
                "none";

        } finally {

            joinButton.disabled =
                false;

            joinButton.textContent =
                "Увійти в кімнату";

        }

    }


    /* =====================================================
       CAMERA
    ===================================================== */

    async function toggleCamera() {

        if (!room) {
            return;
        }

        try {

            const local =
                room.localParticipant;

            await local.setCameraEnabled(
                !local.isCameraEnabled
            );

            updateControls();

        } catch (error) {

            console.error(
                "Camera error:",
                error
            );

        }

    }


    /* =====================================================
       MICROPHONE
    ===================================================== */

    async function toggleMicrophone() {

        if (!room) {
            return;
        }

        const state =
            getPlayerState(
                participantName
            );

        if (
            state.mutedByHost
        ) {

            alert(
                "Ведучий вимкнув вам мікрофон."
            );

            return;

        }

        try {

            const local =
                room.localParticipant;

            await local.setMicrophoneEnabled(
                !local.isMicrophoneEnabled
            );

            updateControls();

        } catch (error) {

            console.error(
                "Microphone error:",
                error
            );

        }

    }


    /* =====================================================
       VOLUME PANEL
    ===================================================== */

    function toggleVolumePanel() {

        const visible =
            volumePanel.style.display ===
            "block";

        volumePanel.style.display =
            visible
                ? "none"
                : "block";

        if (!visible) {
            updateVolumeList();
        }

    }


    /* =====================================================
       LEAVE ROOM
    ===================================================== */

    async function leaveRoom() {

        if (leaving) {
            return;
        }

        leaving =
            true;

        try {

            if (ws) {

                try {
                    ws.close();
                } catch {}

                ws =
                    null;

            }

            if (room) {

                try {

                    room.localParticipant
                        .trackPublications
                        .forEach(
                            publication => {

                                try {

                                    if (
                                        publication.track
                                    ) {

                                        publication.track.stop();

                                    }

                                } catch {}

                            }
                        );

                } catch {}

                try {

                    await room.disconnect();

                } catch (error) {

                    console.error(
                        "Room disconnect error:",
                        error
                    );

                }

                room =
                    null;

            }

        } finally {

            document
                .querySelectorAll(
                    "video, audio"
                )
                .forEach(
                    element => {

                        try {
                            element.pause();
                        } catch {}

                        try {
                            element.srcObject =
                                null;
                        } catch {}

                        element.remove();

                    }
                );

            participantCards.clear();
            videoElements.clear();
            audioElements.clear();

            hostStates.clear();
            roomOrder = [];

            currentHostIdentity =
                null;

            isHost =
                false;

            selectedHostTarget =
                null;

            videoGrid.innerHTML =
                "";

            volumeList.innerHTML =
                "";

            volumePanel.style.display =
                "none";

            hostPanel.style.display =
                "none";

            hostMenu.style.display =
                "none";

            app.style.display =
                "none";

            loginScreen.style.display =
                "flex";

            connectionStatus.textContent =
                "Підключення...";

            participantsCount.textContent =
                "0 / 12";

            leaving =
                false;

        }

    }
        /* =====================================================
       BUTTON EVENTS
    ===================================================== */

    joinButton.addEventListener(
        "click",
        joinRoom
    );


    roomInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                nameInput.focus();

            }

        }
    );


    nameInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                joinRoom();

            }

        }
    );


    cameraButton.addEventListener(
        "click",
        toggleCamera
    );


    micButton.addEventListener(
        "click",
        toggleMicrophone
    );


    volumeButton.addEventListener(
        "click",
        toggleVolumePanel
    );


    leaveButton.addEventListener(
        "click",
        async () => {

            if (
                confirm(
                    "Вийти з кімнати?"
                )
            ) {

                await leaveRoom();

            }

        }
    );


    /* =====================================================
       HOST PANEL
    ===================================================== */

    hostPanelButton.addEventListener(
        "click",
        () => {

            if (!isHost) {
                return;
            }

            const visible =
                hostPanel.style.display ===
                "block";

            hostPanel.style.display =
                visible
                    ? "none"
                    : "block";

            if (!visible) {

                renderHostPanel();

            }

        }
    );


    /* =====================================================
       HOST MENU BUTTONS
    ===================================================== */

    document
        .getElementById(
            "hostKillButton"
        )
        .addEventListener(
            "click",
            () => {

                if (
                    selectedHostTarget
                ) {

                    sendHostAction(
                        "kill",
                        selectedHostTarget
                    );

                }

                closeHostMenu();

            }
        );


    document
        .getElementById(
            "hostReviveButton"
        )
        .addEventListener(
            "click",
            () => {

                if (
                    selectedHostTarget
                ) {

                    sendHostAction(
                        "revive",
                        selectedHostTarget
                    );

                }

                closeHostMenu();

            }
        );


    document
        .getElementById(
            "hostMuteButton"
        )
        .addEventListener(
            "click",
            () => {

                if (
                    selectedHostTarget
                ) {

                    sendHostAction(
                        "mute",
                        selectedHostTarget
                    );

                }

                closeHostMenu();

            }
        );


    document
        .getElementById(
            "hostUnmuteButton"
        )
        .addEventListener(
            "click",
            () => {

                if (
                    selectedHostTarget
                ) {

                    sendHostAction(
                        "unmute",
                        selectedHostTarget
                    );

                }

                closeHostMenu();

            }
        );


    document
        .getElementById(
            "hostHighlightButton"
        )
        .addEventListener(
            "click",
            () => {

                if (
                    selectedHostTarget
                ) {

                    sendHostAction(
                        "highlight",
                        selectedHostTarget
                    );

                }

                closeHostMenu();

            }
        );


    document
        .getElementById(
            "hostUnhighlightButton"
        )
        .addEventListener(
            "click",
            () => {

                if (
                    selectedHostTarget
                ) {

                    sendHostAction(
                        "unhighlight",
                        selectedHostTarget
                    );

                }

                closeHostMenu();

            }
        );


    document
        .getElementById(
            "hostHideCameraButton"
        )
        .addEventListener(
            "click",
            () => {

                if (
                    selectedHostTarget
                ) {

                    sendHostAction(
                        "hide-camera",
                        selectedHostTarget
                    );

                }

                closeHostMenu();

            }
        );


    document
        .getElementById(
            "hostShowCameraButton"
        )
        .addEventListener(
            "click",
            () => {

                if (
                    selectedHostTarget
                ) {

                    sendHostAction(
                        "show-camera",
                        selectedHostTarget
                    );

                }

                closeHostMenu();

            }
        );


    document
        .getElementById(
            "hostKickButton"
        )
        .addEventListener(
            "click",
            () => {

                if (
                    selectedHostTarget
                ) {

                    const card =
                        participantCards.get(
                            selectedHostTarget
                        );

                    const name =
                        card?.querySelector(
                            ".participant-name"
                        )?.textContent ||
                        selectedHostTarget;

                    if (
                        confirm(
                            `Вигнати ${name} з кімнати?`
                        )
                    ) {

                        sendHostAction(
                            "kick",
                            selectedHostTarget
                        );

                    }

                }

                closeHostMenu();

            }
        );


    /* =====================================================
       CLOSE PANELS WHEN CLICKING OUTSIDE
    ===================================================== */

    document.addEventListener(
        "click",
        event => {

            if (
                hostMenu.style.display ===
                    "block" &&
                !hostMenu.contains(
                    event.target
                )
            ) {

                closeHostMenu();

            }

        }
    );


    document.addEventListener(
        "click",
        event => {

            if (
                volumePanel.style.display ===
                    "block" &&
                !volumePanel.contains(
                    event.target
                ) &&
                event.target !==
                    volumeButton
            ) {

                volumePanel.style.display =
                    "none";

            }

        }
    );


    document.addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Escape"
            ) {

                closeHostMenu();

                volumePanel.style.display =
                    "none";

                hostPanel.style.display =
                    "none";

            }

        }
    );


    /* =====================================================
       CAMERA / MICROPHONE PERMISSIONS
    ===================================================== */

    async function checkMediaPermissions() {

        try {

            if (
                !navigator.mediaDevices ||
                !navigator.mediaDevices.getUserMedia
            ) {

                return;

            }

            const stream =
                await navigator.mediaDevices
                    .getUserMedia({
                        video: true,
                        audio: true
                    });

            stream
                .getTracks()
                .forEach(
                    track => track.stop()
                );

        } catch (error) {

            console.warn(
                "Media permission warning:",
                error
            );

        }

    }


    /* =====================================================
       HOST MUTE ENFORCEMENT
    ===================================================== */

    async function enforceHostMute() {

        if (!room) {
            return;
        }

        const state =
            getPlayerState(
                participantName
            );

        if (
            !state.mutedByHost
        ) {
            return;
        }

        const local =
            room.localParticipant;

        if (
            local.isMicrophoneEnabled
        ) {

            try {

                await local
                    .setMicrophoneEnabled(
                        false
                    );

            } catch (error) {

                console.error(
                    "Host mute error:",
                    error
                );

            }

        }

        updateControls();

    }


    /* =====================================================
       PERIODIC STATE CHECK
    ===================================================== */

    setInterval(
        () => {

            if (
                room &&
                !leaving
            ) {

                enforceHostMute();

                updateControls();

            }

        },
        1000
    );


    /* =====================================================
       DEVICE ERROR HANDLING
    ===================================================== */

    window.addEventListener(
        "unhandledrejection",
        event => {

            console.error(
                "Unhandled promise rejection:",
                event.reason
            );

        }
    );


    window.addEventListener(
        "error",
        event => {

            console.error(
                "Global error:",
                event.error
            );

        }
    );


    /* =====================================================
       BEFORE UNLOAD
    ===================================================== */

    window.addEventListener(
        "beforeunload",
        () => {

            leaving = true;

            if (ws) {

                try {
                    ws.close();
                } catch {}

            }

            if (room) {

                try {
                    room.disconnect();
                } catch {}

            }

        }
    );


    /* =====================================================
       INITIAL STATE
    ===================================================== */

    hostPanelButton.style.display =
        "none";

    hostPanel.style.display =
        "none";

    hostMenu.style.display =
        "none";

    volumePanel.style.display =
        "none";


    /* =====================================================
       MEDIA PERMISSIONS
    ===================================================== */

    checkMediaPermissions();


    /* =====================================================
       DEBUG
    ===================================================== */

    console.log(
        "🎭 Mafia Video Room loaded"
    );

</script>
